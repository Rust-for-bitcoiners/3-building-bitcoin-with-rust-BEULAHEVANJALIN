[package]
name = "a-3"
version = "0.1.0"
edition = "2021"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.9"
reqwest = { version = "0.11", features = ["json", "blocking"] }
base64 = "0.13"
ripemd160 = "0.9"
base58 = "0.2.0" 